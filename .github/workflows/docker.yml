name: Docker image

# Builds the production image and publishes it to GitHub Container Registry on
# every version tag (v0.2.0 → :0.2.0, :0.2, :latest). Self-hosters can then run
# `image: ghcr.io/honzaprikryl/tradenza:latest` instead of building locally.
#
# The image is compiled with a placeholder Clerk publishable key; the container
# entrypoint swaps in the real one from the environment at startup (see
# scripts/docker-entrypoint.sh), so one public image serves every deployment.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # A manual run is not on a tag, so every rule above yields nothing and
            # `push: true` would fail on an empty tag list. Give those runs their
            # own moving tag instead.
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
